name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm install
      - run: npm run test:unit

  integration:
    name: Integration tests (pi CLI)
    runs-on: ubuntu-latest
    env:
      # OpenRouter key (minted with a small balance). Free models are used
      # via PI_TEST_MODEL below so the balance lasts.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Free OpenRouter model — keeps the integration tests within the key's
      # tiny monthly budget. Override per-run if needed.
      PI_TEST_MODEL: openrouter/cohere/north-mini-code:free
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install pi CLI
        run: npm install -g @earendil-works/pi-coding-agent
      - run: npm install
      - name: Run integration tests
        run: npm run test:integration
        timeout-minutes: 25